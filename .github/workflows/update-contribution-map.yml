name: Update contribution map

on:
  schedule:
    # 11:45 PM India Standard Time every day (18:15 UTC).
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-map:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate contribution map
        run: npm run generate
        env:
          GH_USERNAME: vikassampath
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/github-jet.svg
          if git diff --cached --quiet; then
            echo "Contribution map is already up to date."
          else
            git commit -m "Update contribution map"
            git push
          fi
